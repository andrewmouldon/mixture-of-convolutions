[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moc"
version = "0.1.0"
description = "Mixture of causal convolutions with Triton kernels"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "triton",
]

[tool.setuptools.packages.find]
include = ["moc*"]
